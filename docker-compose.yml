# ============================================================================
#  Green Logistics Management System - Part 3 SOA
#  docker-compose.yml - spins up the entire ecosystem:
#    1. sql-server-db     (Microsoft SQL Server 2022)
#    2. glms-backend-api  (ASP.NET Core Web API)  -> connects to (1)
#    3. glms-frontend-web (ASP.NET Core MVC app)  -> connects to (2)
#  All three communicate over an internal Docker bridge network.
#  Reference: Docker Inc. 2024. Compose file reference.
#  https://docs.docker.com/compose/compose-file/ [Accessed 31 May 2026].
# ============================================================================

services:

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Demo_Str0ng!Pass_2026"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    networks:
      - glms-net
    volumes:
      - glms-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"Demo_Str0ng!Pass_2026\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  glms-backend-api:
    build:
      context: .
      dockerfile: GreenLogisticsMS.Api/Dockerfile
    container_name: glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # The API talks to the DB container by its service name, not localhost.
      ConnectionStrings__DefaultConnection: "Server=sql-server-db,1433;Database=GreenLogisticsMS;User Id=sa;Password=Demo_Str0ng!Pass_2026;TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "demo-only-signing-key-replace-in-production-0123456789"
      Jwt__Issuer: "GreenLogisticsMS.Api"
      Jwt__Audience: "GreenLogisticsMS.Web"
      Jwt__ExpiryHours: "8"
    ports:
      - "5080:8080"
    depends_on:
      sql-server-db:
        condition: service_healthy
    networks:
      - glms-net

  glms-frontend-web:
    build:
      context: .
      dockerfile: GreenLogisticsMS.Web/Dockerfile
    container_name: glms-frontend-web
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # The MVC client calls the API container by its service name.
      ApiBaseUrl: "http://glms-backend-api:8080/"
    ports:
      - "5090:8080"
    depends_on:
      - glms-backend-api
    networks:
      - glms-net

networks:
  glms-net:
    driver: bridge

volumes:
  glms-sqldata:
